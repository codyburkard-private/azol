title: Azol Documentation
description: A python-based pentesting library for Azure and Entra ID
baseurl: ""
url: "https://codyburkard-private.github.io/azol"
remote_theme: pages-themes/slate@v0.2.0
plugins:
- jekyll-remote-theme 

# Jekyll settings
markdown: kramdown
highlighter: rouge

# Permalinks
permalink: pretty


# Exclude files
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

