name: Live Graph harness

on:
  push:
    branches:
      - live-test
  workflow_dispatch:
    inputs:
      ensure:
        description: Run harness ensure before tests
        type: boolean
        default: true
      reset:
        description: Reset harness states before ensure (always on for push to live-test)
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  live-graph:
    runs-on: ubuntu-latest
    environment: azoltest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZOL_LIVE_CLIENT_ID }}
          tenant-id: ${{ vars.AZOL_LIVE_TENANT_ID }}
          allow-no-subscriptions: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Reset tenant states
        if: ${{ github.event_name == 'push' || inputs.reset }}
        env:
          AZOL_LIVE_TENANT: azoltest.onmicrosoft.com
          AZOL_LIVE_CLIENT_ID: ${{ vars.AZOL_LIVE_CLIENT_ID }}
          AZOL_LIVE_TENANT_ID: ${{ vars.AZOL_LIVE_TENANT_ID }}
          PYTHONPATH: tests
        run: python -m graph.live.harness.cli reset

      - name: Ensure tenant states
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.ensure }}
        env:
          AZOL_LIVE_TENANT: azoltest.onmicrosoft.com
          AZOL_LIVE_CLIENT_ID: ${{ vars.AZOL_LIVE_CLIENT_ID }}
          AZOL_LIVE_TENANT_ID: ${{ vars.AZOL_LIVE_TENANT_ID }}
          PYTHONPATH: tests
        run: python -m graph.live.harness.cli ensure

      - name: Run live Graph tests
        env:
          AZOL_LIVE_TENANT: azoltest.onmicrosoft.com
          AZOL_LIVE_CLIENT_ID: ${{ vars.AZOL_LIVE_CLIENT_ID }}
          AZOL_LIVE_TENANT_ID: ${{ vars.AZOL_LIVE_TENANT_ID }}
          PYTHONPATH: tests
        run: python -m unittest discover -s tests/graph/live -v
