name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: Publish destination
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and release tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify tag matches package version
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=$TAG package=$PKG_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG) does not match pyproject.toml version ($PKG_VERSION)"
            exit 1
          fi

      - name: Run unit tests
        env:
          AZOL_LIVE_GRAPH: "0"
          PYTHONPATH: tests
        run: python -m unittest discover -s tests -v

      - name: Build and check distributions
        run: |
          python -m build
          twine check dist/*

      - name: Publish to TestPyPI
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PyPiTestSecret }}
        run: twine upload dist/* --repository testpypi --verbose

      - name: Publish to PyPI
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi') }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PyPiProdSecret }}
        run: twine upload dist/* --repository pypi --verbose

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "azol ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
